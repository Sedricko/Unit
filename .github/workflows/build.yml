name: build

on:
  push:
  workflow_dispatch:

# um push novo cancela o build anterior do mesmo branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # para publicar o APK na pagina de releases
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Testa e gera o APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: unit-apk
          path: app/build/outputs/apk/release/app-release.apk
      # uma release por versao (versionName), atualizada a cada push na main
      - name: Publica na pagina de releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "Unit-$v.apk"
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" "Unit-$v.apk" --clobber
          else
            gh release create "v$v" "Unit-$v.apk" --target "$GITHUB_SHA" --title "Unit $v" --notes "APK do Unit $v. Instala por cima da versao anterior."
          fi
